name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build and validation tools
        run: pacman -Syu --noconfirm cmake fcitx5 gcc jq ninja pkgconf python shellcheck
      - name: Run checks
        run: ./scripts/check
